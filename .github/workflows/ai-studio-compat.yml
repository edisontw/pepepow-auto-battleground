name: AI Studio compatibility check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-studio-compat.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Smoke test dev server
        shell: bash
        run: |
          set -euo pipefail
          npm run dev >/tmp/dev.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/home.html; then
              test -s /tmp/home.html
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dev.log
          exit 1
