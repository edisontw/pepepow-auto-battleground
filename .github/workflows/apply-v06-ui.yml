name: Apply v0.6 UI update

on:
  push:
    branches: [v06-ui-totems-mobile-layout]
    paths:
      - '.github/workflows/apply-v06-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v06-ui-totems-mobile-layout

      - name: Apply targeted v0.6 changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          game = Path('app/game.tsx')
          text = game.read_text()

          old_start = '''  const startNew = () => {
            const starters: OwnedUnit[] = [
              { uid: uid(), unitId: "tunnel-guard", star: 1, position: 34, itemIds: [] },
              { uid: uid(), unitId: "pickaxe-scout", star: 1, position: 37, itemIds: [] },
            ];
            const nextSeed = crypto.getRandomValues(new Uint32Array(1))[0] || 1;
            const restarting = active;
          '''
          new_start = '''  const startNew = () => {
            const nextSeed = crypto.getRandomValues(new Uint32Array(1))[0] || 1;
            const starterRandom = createSeededRandom(mixSeed(nextSeed, 0x57a7));
            const starterPool = UNITS.filter((unit) => unit.cost === 1);
            const starters: OwnedUnit[] = [34, 37].map((position) => {
              const pickIndex = starterRandom.int(starterPool.length);
              const [def] = starterPool.splice(pickIndex, 1);
              return { uid: uid(), unitId: (def ?? UNITS[0]).id, star: 1 as const, position, itemIds: [] };
            });
            const restarting = active;
          '''
          if old_start not in text:
              raise SystemExit('startNew target not found')
          text = text.replace(old_start, new_start, 1)
          text = text.replace('setNotice("Your first neutral encounter is ahead. Both sides field two units.");', 'setNotice("Opening crew randomized. Your first neutral encounter is ahead.");', 1)

          board_anchor = '<div className="enemy-nameplate"><span>{phase === "battle" ? (pve ? (isBoss ? "VOID FOREMAN" : "NEUTRAL CREW") : opponent?.name) : "ENEMY TERRITORY"}</span><i /></div>'
          board_insert = board_anchor + '\n            <SynergyTotems rows={synergyRows} />'
          if board_anchor not in text:
              raise SystemExit('board target not found')
          text = text.replace(board_anchor, board_insert, 1)

          dock_anchor = 'function MobileStatusDock({ panel, onPanel, rows, items, selectedItem, onSelectItem, onOpenTraitArchive, onOpenItemArchive }:'
          totem_component = '''function SynergyTotems({ rows }: { rows: SynergyRow[] }) {
            const visible = rows.filter((row) => row.count > 0).slice(0, 5);
            if (!visible.length) return null;
            return <div className="synergy-totems" aria-label="Formation synergy progress">{visible.map((row) => {
              const goal = row.nextThreshold ?? row.threshold;
              return <div className={`synergy-totem tier-${row.tier}`} key={row.trait} title={`${row.trait}: ${row.count}/${goal}${row.tier ? ` · ${row.value}` : ""}`}>
                <span className="synergy-sigil">{row.trait.slice(0, 1)}</span>
                <b>{row.count}/{goal}</b>
                <i><em style={{ width: `${Math.min(100, row.count / Math.max(1, goal) * 100)}%` }} /></i>
              </div>;
            })}</div>;
          }

          ''' + dock_anchor
          if dock_anchor not in text:
              raise SystemExit('mobile dock target not found')
          text = text.replace(dock_anchor, totem_component, 1)
          game.write_text(text)

          layout = Path('app/layout.tsx')
          layout_text = layout.read_text()
          if 'import "./v06-overrides.css";' not in layout_text:
              layout_text = layout_text.replace('import "./globals.css";', 'import "./globals.css";\nimport "./v06-overrides.css";', 1)
          layout.write_text(layout_text)

          css = r'''/* v0.6 targeted layout + synergy-totem refinements */

.synergy-totems {
  position:absolute;
  z-index:24;
  top:24px;
  right:8px;
  display:flex;
  gap:7px;
  pointer-events:none;
}
.synergy-totem {
  --totem:#657a69;
  width:39px;
  display:grid;
  grid-template-rows:27px 10px 3px;
  justify-items:center;
  align-items:center;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.75));
}
.synergy-sigil {
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  border:2px solid color-mix(in srgb,var(--totem),#f3d771 25%);
  border-radius:50%;
  background:radial-gradient(circle at 38% 30%,color-mix(in srgb,var(--totem),#fff 24%),#071009 68%);
  color:#d6e5d7;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.55),0 0 9px color-mix(in srgb,var(--totem),transparent 52%);
  font:900 11px/1 var(--font-geist-mono),monospace;
}
.synergy-totem b { color:#b6c5b6; font:900 8px/1 var(--font-geist-mono),monospace; text-shadow:0 1px 2px #000; }
.synergy-totem>i { width:30px; height:3px; overflow:hidden; border-radius:2px; background:#252a25; box-shadow:0 1px 2px #000 inset; }
.synergy-totem>i>em { display:block; height:100%; background:linear-gradient(90deg,#d9b442,#eef08a); }
.synergy-totem.tier-1 { --totem:#4b9d68; }.synergy-totem.tier-1 b { color:#d9d75d; }
.synergy-totem.tier-2 { --totem:#d2ae42; }.synergy-totem.tier-2 .synergy-sigil { border-radius:32% 32% 42% 42%; color:#fff0a0; }

@media (min-width:901px) {
  .game-shell { --shop-h:116px; }
  .arena-panel { grid-template-rows:26px minmax(0,1fr) 46px 23px; }
  .bench-wrap { height:46px; }
  .battle-board { max-width:min(820px,96%); max-height:615px; }
  .shop-bar { height:var(--shop-h); min-height:var(--shop-h); flex-basis:var(--shop-h); grid-template-columns:158px minmax(0,1fr) 168px; padding:4px 7px 5px; }
  .shop-controls { gap:3px; }.shop-controls button { padding:4px 5px; }.shop-controls small { font-size:5px; }
  .shop-market { grid-template-rows:14px minmax(0,1fr); }
  .shop-card { grid-template-rows:34px minmax(0,1fr); }
  .shop-info { padding:3px 5px; }.shop-info>b { font-size:8px; }.shop-info p { font-size:5px; }
  .battle-button { padding:8px 12px; }.battle-button b { font-size:9px; }
}

@media (max-height:820px) and (min-width:901px) {
  .game-shell { --header-h:52px; --shop-h:96px; }
  .arena-panel { grid-template-rows:23px minmax(0,1fr) 42px 20px; }
  .bench-wrap { height:42px; }
  .battle-board { max-width:min(720px,94%); }
  .shop-bar { height:var(--shop-h); min-height:var(--shop-h); flex-basis:var(--shop-h); }
  .shop-card { grid-template-rows:30px minmax(0,1fr); }
}

@media (max-width:900px) {
  .game-shell { --header-h:48px; --shop-h:104px; }
  .topbar { height:var(--header-h); min-height:var(--header-h); padding:0 4px; grid-template-columns:auto auto 1fr auto; }
  .mini-brand img { width:29px; height:29px; }
  .mini-brand span { display:none; }
  .round-label { gap:2px; padding:0 4px; }
  .round-label small { font-size:5px; letter-spacing:.08em; }
  .round-label strong { font-size:17px; line-height:1; }
  .round-label>span { display:none; }
  .resource-row { min-width:0; }
  .resource-row>div { min-width:0; padding:0 5px; }
  .resource-row small { font-size:5px; }
  .resource-row b { font-size:10px; white-space:nowrap; }
  .resource-row .gold b { color:#f0c454; font-size:12px; text-shadow:0 0 7px rgba(240,196,84,.25); }
  .resource-row .level { display:grid; grid-template-columns:auto auto; grid-template-rows:12px 17px; column-gap:4px; align-items:center; }
  .resource-row .level small { grid-column:1/-1; }
  .resource-row .level b { grid-row:2; font-size:18px; color:#78dda0; }
  .resource-row .level span { grid-row:2; display:block !important; color:#9cad9f; font:700 6px/1 var(--font-geist-mono),monospace; white-space:nowrap; }
  .header-actions { gap:1px; margin-left:1px; }.header-actions button { width:27px; height:27px; }
  .music-volume { width:30px; }

  .arena-panel { grid-template-rows:21px auto 40px 21px; padding-bottom:36px; }
  .phase-banner { height:21px; min-height:21px; }
  .bench-wrap { height:40px; }
  .notice-bar { min-height:21px; }
  .battle-board { width:min(100%,calc((100dvh - var(--header-h) - var(--shop-h) - 78px) * .95238)); max-height:calc(100dvh - var(--header-h) - var(--shop-h) - 78px); }

  .game-shell .piece-base { display:none !important; }
  .bench .unit-token.compact .unit-art { left:-4%; top:-7%; width:108%; height:108%; }
  .bench .unit-token.compact .unit-aura { bottom:0; opacity:.12; }

  .synergy-totems { top:18px; right:4px; gap:3px; }
  .synergy-totem { width:31px; grid-template-rows:22px 8px 2px; }
  .synergy-sigil { width:22px; height:22px; border-width:1px; font-size:8px; }
  .synergy-totem b { font-size:6px; }.synergy-totem>i { width:23px; height:2px; }

  .mobile-status-dock { height:36px; padding:2px; }.mobile-status-dock>button { grid-template-columns:19px 1fr auto; padding:2px 6px; }.mobile-status-dock>button span { font-size:12px; }
  .mobile-status-panel { bottom:35px; }

  .shop-bar { height:var(--shop-h); min-height:var(--shop-h); flex-basis:var(--shop-h); grid-template-columns:minmax(0,1fr) 104px; grid-template-rows:61px 36px; gap:3px; padding:2px 4px max(3px,env(safe-area-inset-bottom)); }
  .shop-market { grid-template-rows:12px minmax(0,1fr); }
  .shop-odds { font-size:5px; gap:3px; }
  .shop-cards { grid-template-columns:repeat(5,74px); gap:3px; }
  .shop-card { height:46px; grid-template-rows:29px 1fr; }
  .shop-card .shop-info>b { font-size:6px; }.shop-card>strong { font-size:6px; }
  .shop-controls { gap:2px; }.shop-controls button,.shop-controls button:first-child { min-height:36px; height:36px; padding:2px; }.shop-controls span { font-size:12px; }.shop-controls b { font-size:5.5px; }
  .battle-button { height:36px; padding:3px 5px; }.battle-button b { font-size:7px; }
}

@media (max-width:600px) {
  .round-label strong { font-size:16px; }
  .resource-row>div { padding:0 4px; }
  .resource-row .gold b { font-size:11px; }
  .resource-row .level b { font-size:17px; }
}
'''
          Path('app/v06-overrides.css').write_text(css)

          state = Path('PROJECT_STATE.md')
          state_text = state.read_text().replace('**Last updated:** 2026-08-14', '**Last updated:** 2026-08-15', 1)
          marker = '## 15. Next-task protocol\n'
          addition = '''## 15. v0.6 working branch (not yet deployed)\n\n- Opening player units are randomized from distinct 1-cost units using the expedition seed instead of always starting with Tunnel Guard + Pickaxe Scout.\n- Board now shows compact live synergy-progress totems sourced from the existing authoritative synergy rows.\n- Mobile HUD restores visible XP, emphasizes level and Gold, shrinks the Shop/status footprint, and removes remaining mobile piece bases including Bench bases.\n- Desktop Shop and Bench chrome are reduced to return more vertical space to the Board.\n\n## 16. Next-task protocol\n'''
          if marker not in state_text:
              raise SystemExit('PROJECT_STATE marker not found')
          state_text = state_text.replace(marker, addition, 1)
          state.write_text(state_text)
          PY

          rm -f .github/workflows/apply-v06-ui.yml
          git diff --check

      - name: Commit targeted changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add synergy totems and compact responsive layout'
          git push origin HEAD:v06-ui-totems-mobile-layout
