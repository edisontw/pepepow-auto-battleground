name: Import v0.5 source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v05.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download source ZIP
        shell: bash
        run: |
          set -euo pipefail
          URL1='https://drive.google.com/uc?export=download&id=14nXLYrDYPccJP76zEATaUfHToS1etlFR'
          URL2='https://drive.usercontent.google.com/download?id=14nXLYrDYPccJP76zEATaUfHToS1etlFR&export=download&confirm=t'
          if ! curl -L --fail --retry 3 "$URL1" -o /tmp/source.zip; then
            curl -L --fail --retry 3 "$URL2" -o /tmp/source.zip
          fi
          python - <<'PY'
          import zipfile
          p='/tmp/source.zip'
          with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
              print(f'ZIP OK: {len(z.infolist())} entries')
          PY

      - name: Import exact exported project tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v05-src
          mkdir -p /tmp/v05-src
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/source.zip') as z:
              z.extractall('/tmp/v05-src')
          PY
          rsync -a --exclude='.git/' --exclude='.github/' /tmp/v05-src/ ./

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Import PEPEPOW Auto Battleground v0.5 source'
          git push origin HEAD:main
