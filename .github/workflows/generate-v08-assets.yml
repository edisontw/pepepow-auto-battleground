name: Generate v0.8 unit assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-v08-assets.yml'
      - 'scripts/generate-v08-unit-art.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python scripts/generate-v08-unit-art.py
      - name: Commit generated WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/units/arcane-apprentice.webp public/units/rune-blaster.webp public/units/chrono-mage.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add v0.8 Arcanist WebP assets"
          git push origin HEAD:main
