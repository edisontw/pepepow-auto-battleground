name: Verify v0.8 candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v08-verify.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build and regression tests
        shell: bash
        run: |
          # Targeted v0.8 rerun after making the Shop-odds fixture derive from the live unit pool.
          set +e
          npm run build > /tmp/v08-test.log 2>&1
          build_code=$?
          if [ "$build_code" -eq 0 ]; then
            node --import tsx --test tests/*.test.ts >> /tmp/v08-test.log 2>&1
            code=$?
          else
            code=$build_code
          fi
          if [ "$code" -eq 0 ]; then
            printf 'PASS\ncommit=%s\nproduction_build=PASS\ntypescript_regressions=PASS\n' "$(git rev-parse HEAD)" > V08_TEST_RESULT.txt
          else
            printf 'FAIL\ncommit=%s\n\n' "$(git rev-parse HEAD)" > V08_TEST_RESULT.txt
            tail -n 160 /tmp/v08-test.log >> V08_TEST_RESULT.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V08_TEST_RESULT.txt
          git commit -m "Record v0.8 targeted test result"
          git push origin HEAD:main
          exit "$code"
