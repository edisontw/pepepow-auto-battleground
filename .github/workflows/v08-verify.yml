name: Verify v0.8 candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v08-verify.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Test and record result
        shell: bash
        run: |
          set +e
          npm test > /tmp/v08-test.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            printf 'PASS\ncommit=%s\n' "$(git rev-parse HEAD)" > V08_TEST_RESULT.txt
          else
            printf 'FAIL\ncommit=%s\n\n' "$(git rev-parse HEAD)" > V08_TEST_RESULT.txt
            tail -n 120 /tmp/v08-test.log >> V08_TEST_RESULT.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V08_TEST_RESULT.txt
          git commit -m "Record v0.8 test result"
          git push origin HEAD:main
          exit "$code"
