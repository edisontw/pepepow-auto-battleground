name: Validate v0.6 branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-v06-branch.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v06-ui-totems-mobile-layout
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
