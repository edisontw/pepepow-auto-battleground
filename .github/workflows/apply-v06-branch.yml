name: Apply v0.6 branch patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v06-branch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v06-ui-totems-mobile-layout

      - name: Apply targeted patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git diff --check

      - name: Commit branch changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/game.tsx app/layout.tsx app/v06-overrides.css PROJECT_STATE.md
          git commit -m 'Add synergy totems and compact responsive layout'
          git push origin HEAD:v06-ui-totems-mobile-layout
